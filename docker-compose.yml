services:
  btgencobot:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: btgencobot
    hostname: btgencobot

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "6080:6080"
      - "5901:5901"
      - "8765:8765"
      - "8001:8001" 
    volumes:
      - ./src:/workspace/src:cached
      - ./robot_description:/workspace/robot_description:cached
      - ./worlds:/workspace/worlds:cached
      - ./models:/workspace/models:cached
      - ./scripts:/workspace/scripts:cached
      - ./install:/workspace/install:delegated
      - ./build:/workspace/build:delegated
      - ./log:/workspace/log:delegated
      - ./web_gateway:/workspace/web_gateway:cached
      - ./web_gateway:/opt/web_gateway:cached
    environment:
      - ROS_DOMAIN_ID=42
      - DISPLAY=:1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    stdin_open: true
    tty: true
    command: /bin/bash