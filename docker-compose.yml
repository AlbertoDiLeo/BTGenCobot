services:
  # All-in-one ROS2 workspace with Gazebo, Nav2, and ML dependencies
  btgencobot:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: btgencobot
    hostname: btgencobot
    ports:
      - "6080:6080" # noVNC web interface
      - "5901:5901" # VNC server
      - "8765:8765" # Foxglove Bridge
    #user: "${UID}:${GID}" # Run container with host user permissions to avoid file permission issues
    volumes:
      # Mount only necessary directories instead of entire project
      - ./src:/workspace/src:cached
      - ./robot_description:/workspace/robot_description:cached
      - ./worlds:/workspace/worlds:cached
      - ./models:/workspace/models:cached # Mount models as volume instead of copying
      - ./scripts:/workspace/scripts:cached
      # ROS2 build artifacts (use delegated for better performance)
      - ./install:/workspace/install:delegated
      - ./build:/workspace/build:delegated
      - ./log:/workspace/log:delegated
    environment:
      - ROS_DOMAIN_ID=42
      - DISPLAY=:1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Gazebo resource paths to include mounted models
      - IGN_GAZEBO_RESOURCE_PATH=/workspace/models/turtlebot3_gazebo/models:/workspace/models
      - GZ_SIM_RESOURCE_PATH=/workspace/models/turtlebot3_gazebo/models:/workspace/models
      - GAZEBO_MODEL_PATH=/workspace/models/turtlebot3_gazebo/models:/workspace/models

    stdin_open: true
    tty: true
    #command: /bin/bash